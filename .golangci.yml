# golangci-lint v2 配置（CI lint 任务消费，见 .github/workflows/ci.yml）
#
# 策略：标准五件套（errcheck/govet/ineffassign/staticcheck/unused）全开，
# 仅保留两类风格性豁免（Close 惯例、测试助手风格）——CI 对一切违规保持红灯。
# 生产代码存量豁免已随 2fba6f6 清偿完毕并移除。
version: "2"

linters:
  default: standard
  settings:
    errcheck:
      exclude-functions:
        # 存量：defer f.Close() / resp.Body.Close() / rc.Close()（读路径 defer
        # 关闭忽略错误为项目既有惯例；写路径 Close 的错误检查后续清偿）
        - (*os.File).Close
        - (io.ReadCloser).Close
        - (mime/multipart.File).Close
  exclusions:
    rules:
      # —— 测试文件：`rec, data = do(...)` 丢弃 rec 是项目既有测试助手风格
      # （SA4006 / ineffassign / 未用测试助手在 *_test.go 内成批存在）——
      - path: _test\.go
        linters: [staticcheck, ineffassign, unused]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
